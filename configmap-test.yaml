# This is a Kubernetes ConfigMap configuration file that defines a ConfigMap named "flash-config" in the "test" namespace. It contains key-value pairs for application configuration, 
# including the application name, environment, and a welcome message.

apiVersion: v1
kind: ConfigMap

metadata:
  name: flash-config
  namespace: test

data:
  APP_NAME: "Flash-Demo"
  ENVIRONMENT: "Test"
  MESSAGE: "Welcome to Flash-Demo Application from ConfigMap in Test Namespace 06/15"
