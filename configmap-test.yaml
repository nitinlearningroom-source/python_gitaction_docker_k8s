# This is a Kubernetes ConfigMap configuration file that defines a ConfigMap named "flask-config" in the "test" namespace. It contains key-value pairs for application configuration, 
# including the application name, environment, and a welcome message.

apiVersion: v1
kind: ConfigMap

metadata:
  name: argo_cd-config
  namespace: { ? { .Release.Namespace } }

data:
  APP_NAME: "argo_cd"
  ENVIRONMENT: "Test"
  MESSAGE: "Welcome to argo_cd Application from ConfigMap in Test Namespace 06/18"
