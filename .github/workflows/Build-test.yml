name  : Build and Deploy
on:  
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
       
jobs:
   build:
        runs-on: ubuntu-latest
    
        steps:
          - uses: actions/checkout@v4
          - name: Set up Python 3.14

            uses: actions/setup-python@v5
            with:
                python-version: 3.14.3

          - name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

          - name: Run tests
            run: |
                python main.py &
                sleep 5
                curl http://localhost:5000/

          - name: login to Docker hub
            uses: docker/login-action@v4
            with:
               username: ${{ secrets.DOCKER_USERNAME }}
               password: ${{ secrets.DOCKER_PASSWORD }}
          - name: Verify Dockerfile
            run: |
                echo "Current directory:"
                pwd
                echo "Files:"
                ls -la
                echo "Dockerfile contents:"
                cat Dockerfile

          - name: Build and push Docker image
            uses: docker/build-push-action@v4
            with:
               context: .
               file: ./Dockerfile
               push: true
               tags: |
                 ${{ secrets.DOCKER_USERNAME }}/flash-demo1:latest
                 ${{ secrets.DOCKER_USERNAME }}/flash-demo1:${{ github.sha }}
   Deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Configure kubectl
            run: |
                echo "Configuring kubectl..."
                mkdir -p $HOME/.kube
                echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
                chmod 600 $HOME/.kube/config
                kubectl config view
          - name: Check secret size
            run: |
                echo "${{ secrets.KUBE_CONFIG }}" | wc -c
                
          - name: Test cluster access
            run: |
              kubectl config current-context
              kubectl cluster-info
              kubectl get nodes

          - name: Update deployment
            run: |
              kubectl set image deployment/flash-demo \
              flash=${{ secrets.DOCKER_USERNAME }}/flash-demo1:${{ github.sha }}

          - name: Verify rolloutgit ad
            run: |
              kubectl rollout status deployment/flash-demo


                
