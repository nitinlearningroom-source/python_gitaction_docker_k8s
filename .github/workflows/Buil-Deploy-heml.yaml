# This is a GitHub Actions workflow configuration file that defines a CI/CD pipeline for building, testing, and deploying a Flask application using Docker and Kubernetes.
# The workflow is triggered on pushes and pull requests to the main branch. It includes steps for setting up Python, installing dependencies, running tests, building and pushing a Docker image,
# and deploying the application to a Kubernetes cluster in a test namespace.

name  : Build and Deploy helm

on:  

    workflow_dispatch:

jobs:
   build:
        runs-on: ubuntu-latest
    
        steps:
          - uses: actions/checkout@v4
          - name: Set up Python 3.14

            uses: actions/setup-python@v5
            with:
                python-version: 3.14.3

          - name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

          - name: Run tests
            run: |
                python main.py &
                sleep 5
                curl http://localhost:5000/

          - name: login to Docker hub
            uses: docker/login-action@v4
            with:
               username: ${{ secrets.DOCKER_USERNAME }}
               password: ${{ secrets.DOCKER_PASSWORD }}
          - name: Verify Dockerfile
            run: |
                echo "Current directory:"
                pwd
                echo "Files:"
                ls -la
                echo "Dockerfile contents:"
                cat Dockerfile

          - name: Build and push Docker image
            uses: docker/build-push-action@v4
            with:
               context: .
               file: ./Dockerfile
               push: true
               tags: |
                 ${{ secrets.DOCKER_USERNAME }}/flash-demo1:latest
                 ${{ secrets.DOCKER_USERNAME }}/flash-demo1:${{ github.sha }}
   Deploy_to_test:
        needs: build
        runs-on: self-hosted
        steps: 

          - uses: actions/checkout@v4

          - name: K8s current context
            run: |
              echo "Checking Kubernetes context..."
              kubectl config current-context

          - name: Configure kubectl
            run: |
                echo "Configuring kubectl..."
                if (!(Test-Path "$HOME\.kube")) {
                    New-Item -ItemType Directory -Path "$HOME\.kube"
                }
                echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
                kubectl config view

          - name: Verify helm installation
            run: |
                echo "Verifying Helm installation..."
                helm version   

          - name: Create test namespace
            run: |
               kubectl create namespace test-helm --dry-run=client -o yaml | kubectl apply -f -

          - name: Deploy helm
            run: |
                helm upgrade --install flask-demo-chart ./flask-demo-chart --namespace test-helm