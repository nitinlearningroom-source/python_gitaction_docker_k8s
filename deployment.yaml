# This is a Kubernetes deployment configuration file for a Flask application named "flask-demo". It defines a deployment with 3 replicas, using the specified Docker image. 
#The environment variables for the application are sourced from a ConfigMap named "flash-config". Note: The image name contains "flash-demo1", which may be a typo and should be verified
# if it should be "flask-demo1".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo
  namespace: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-demo
  template:
    metadata:
      labels:
        app: flask-demo
    spec:
      containers:
      - name: flask-demo
        image: nitindockerlearning/flash-demo1:latest # Check if "flash" should be "flask"
        ports:
        - containerPort: 5000
        # --- FIXED: env must be indented under the container list item ---
        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: flash-config
              key: APP_NAME
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: flash-config
              key: ENVIRONMENT
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: flash-config
              key: MESSAGE
