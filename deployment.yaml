# This is a Kubernetes deployment configuration file for a postgreSQL application named "postgreSQL-demo". It defines a deployment with 3 replicas, using the specified Docker image. 
#The environment variables for the application are sourced from a ConfigMap named "flash-config". Note: The image name contains "flash-demo1", which may be a typo and should be verified
# if it should be "postgreSQL-demo1".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-demo
  namespace: dbcon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgresql-demo
  template:
    metadata:
      labels:
        app: postgresql-demo
    spec:
      containers:
      - name: postgresql-demo
        image: nitindockerlearning/postgresql-demo:latest # Check if "flash" should be "postgreSQL"
        ports:
        - containerPort: 5432
        # --- FIXED: env must be indented under the container list item ---
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
